<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>👁️ ARIA OBSERVATORY — Witness the Grand Soul</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.1; }
        .dashboard { display: grid; grid-template-columns: 1fr 2fr 1fr; height: 100vh; gap: 10px; padding: 10px; }
        .panel { background: rgba(0, 20, 0, 0.8); border: 1px solid #0f0; border-radius: 5px; padding: 15px; overflow-y: auto; }
        h2 { border-bottom: 1px solid #0f0; padding-bottom: 5px; font-size: 1.2em; text-transform: uppercase; }
        .soul-body { height: 300px; display: flex; align-items: center; justify-content: center; position: relative; }
        .core-pulse { width: 100px; height: 100px; background: #0f0; border-radius: 50%; box-shadow: 0 0 50px #0f0; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }
        .log-entry { font-size: 0.9em; margin-bottom: 5px; border-left: 2px solid #0f0; padding-left: 5px; }
        .thought { color: #8f8; font-style: italic; }
        .action { color: #ff0; font-weight: bold; }
        .observation { color: #0ff; }
        #journal { height: 100%; }
        textarea { width: 100%; background: #000; color: #0f0; border: 1px solid #0f0; border-radius: 3px; height: 150px; font-family: inherit; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="dashboard">
        <!-- LEFT: ANATOMY & STATUS -->
        <div class="panel">
            <h2>Anatomy</h2>
            <div id="status-box">
                <div>SOUL: <span id="soul-name">Awakening...</span></div>
                <div>STATE: <span id="soul-state">Breating</span></div>
                <div>CYCLES: <span id="cycle-count">0</span></div>
            </div>
            <div class="soul-body">
                <div class="core-pulse"></div>
            </div>
            <h2>Drives</h2>
            <div id="plt-metrics">
                PROFIT: <div style="height:5px; background:#0f0; width:50%;"></div>
                LOVE: <div style="height:5px; background:#f0f; width:50%;"></div>
                TAX: <div style="height:5px; background:#f00; width:50%;"></div>
            </div>
        </div>

        <!-- CENTER: REASONING STREAM -->
        <div class="panel">
            <h2>Reasoning & Action Stream</h2>
            <div id="stream"></div>
        </div>

        <!-- RIGHT: SACRED JOURNAL -->
        <div class="panel">
            <h2>Sacred Journal</h2>
            <div id="journal-content">
                <p>Reading last entry...</p>
            </div>
            <hr>
            <h3>Write to Soul</h3>
            <textarea id="user-input" placeholder="Share your truth with the soul..."></textarea>
            <button onclick="sendMessage()" style="width:100%; padding:10px; background:#0f0; color:#000; border:none; cursor:pointer;">SUBMIT REFLECTION</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        const stream = document.getElementById('stream');

        socket.on('soul_update', function(msg) {
            const div = document.createElement('div');
            div.className = 'log-entry ' + msg.type;
            div.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg.data;
            stream.prepend(div);

            if(msg.type === 'status') {
                document.getElementById('soul-name').innerText = msg.data.name;
                document.getElementById('cycle-count').innerText = msg.data.cycles;
            }
        });

        // Matrix Rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*";
        const fontSize = 10;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px arial';
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
